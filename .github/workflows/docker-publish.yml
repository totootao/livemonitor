name: Docker Publish

# 触发策略：
#   - push 到 main        → 构建并推送 latest（保持镜像随时可用）
#   - push v* 形式的 tag  → 构建并推送语义化版本号
#   - 手动触发           → 便于回滚或补发指定版本
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定的版本号（留空则使用 latest）'
        required: false
        default: ''

env:
  REGISTRY: docker.io
  # Docker Hub 要求镜像名必须是 <用户名>/<仓库名> 的完整形式。
  # 这里直接写死用户名，避免 secrets.DOCKERHUB_USERNAME 为空时
  # 拼出 "/livemonitor" 这种非法镜像名（login-action 会以费解的错误失败）。
  IMAGE_NAME: totootao/livemonitor

jobs:
  # 先跑一遍测试，测试不过就不发布，避免把坏镜像推上 Docker Hub。
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 检查格式
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test -race -count=1 ./...

  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 计算镜像标签。规则：
      #   - tag 推送（v1.2.3）→ 1.2.3、1.2、latest
      #   - main 分支推送      → latest、edge
      #   - 手动触发           → 输入的版本号，或 latest
      - name: 计算镜像标签与版本号
        id: meta
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # 去掉 v 前缀：v1.2.3 → 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
            MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:${MAJOR_MINOR},${IMAGE_NAME}:latest"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] && [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest"
          else
            # main 分支：使用短 SHA 作为版本号，便于回溯
            VERSION="edge-$(git rev-parse --short HEAD)"
            TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:edge"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "构建版本号：${VERSION}"
          echo "镜像标签：${TAGS}"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 版本号注入二进制，使 `livemonitor version` 与镜像标签一致。
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # 多架构：amd64 + arm64（树莓派/NAS/M 系列 Mac 可直接拉取）。
          platforms: linux/amd64,linux/arm64
          # 层缓存，显著加快重复构建。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 附加构建溯源信息，便于审计镜像来源。
          provenance: true
          sbom: true

      - name: 发布摘要
        run: |
          {
            echo "## 镜像已推送"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 仓库 | \`${{ env.IMAGE_NAME }}\` |"
            echo "| 版本号 | \`${{ steps.meta.outputs.version }}\` |"
            echo "| 标签 | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| 平台 | linux/amd64, linux/arm64 |"
            echo "| 触发方式 | ${{ github.event_name }} |"
            echo ""
            echo "拉取：\`docker pull ${{ env.IMAGE_NAME }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
