name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 检查格式
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test -race -count=1 ./...

      - name: 编译
        run: CGO_ENABLED=0 go build -trimpath -o bin/livemonitor ./cmd/livemonitor

      - name: 校验内嵌资源可用
        # go:embed 指向的文件缺失会导致编译失败，但路径写错而文件恰好存在时
        # 只有运行期才会暴露。这里直接起服务拉一次首页，确认页面确实被内嵌进二进制。
        run: |
          ./bin/livemonitor init -config /tmp/ci-config.json
          ./bin/livemonitor run -config /tmp/ci-config.json -web 127.0.0.1:18099 &
          SRV=$!
          for i in $(seq 1 20); do
            sleep 0.5
            if curl -sf -o /tmp/ci-index.html http://127.0.0.1:18099/; then break; fi
          done
          kill $SRV 2>/dev/null || true
          grep -q "<!DOCTYPE html>" /tmp/ci-index.html
          grep -q "/api/state" /tmp/ci-index.html
          echo "内嵌页面大小: $(wc -c < /tmp/ci-index.html) 字节"
