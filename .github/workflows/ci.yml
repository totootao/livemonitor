name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 检查格式
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test -race -count=1 ./...

      - name: 编译
        run: CGO_ENABLED=0 go build -trimpath -o bin/livemonitor ./cmd/livemonitor

      - name: 校验内嵌资源可用
        # go:embed 指向的文件缺失会导致编译失败，但路径写错而文件恰好存在时
        # 只有运行期才会暴露。这里直接起服务拉一次首页，确认页面确实被内嵌进二进制。
        # 具体逻辑放在脚本里，便于本地复现；打开命令追踪便于失败时定位。
        env:
          VERIFY_EMBED_TRACE: '1'
        run: |
          set +e
          bash scripts/verify-embed.sh bin/livemonitor 2>&1 | tee /tmp/verify-embed.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::内嵌资源校验失败（退出码 $status）"
            echo "----- 完整输出 -----"
            cat /tmp/verify-embed.log
          fi
          exit "$status"
