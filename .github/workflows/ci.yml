name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 检查格式
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test -race -count=1 ./...

      - name: 编译
        run: CGO_ENABLED=0 go build -trimpath -o bin/livemonitor ./cmd/livemonitor

      - name: 校验内嵌资源可用
        # go:embed 指向的文件缺失会导致编译失败，但路径写错而文件恰好存在时
        # 只有运行期才会暴露。这里直接起服务拉一次首页，确认页面确实被内嵌进二进制。
        # 具体逻辑放在脚本里，便于本地复现；打开命令追踪便于失败时定位。
        env:
          VERIFY_EMBED_TRACE: '1'
        run: |
          set +e
          bash scripts/verify-embed.sh bin/livemonitor 2>&1 | tee /tmp/verify-embed.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::内嵌资源校验失败（退出码 $status）"
            echo "----- 完整输出 -----"
            cat /tmp/verify-embed.log
          fi
          exit "$status"

  e2e:
    name: 容器级端到端测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 单元测试全绿不代表镜像能用：缺文件、entrypoint 参数传错、
      # 时区数据丢失这类问题只在真实容器里暴露。这一组用例负责那部分。
      #
      # 曾经真实抓到过的问题：LAME 写入的 Xing/Info 信息帧头里码率字段
      # 与实际音频不符（32k 的文件里写着 56k），导致低码率文件每轮扫描
      # 都被重压一遍。纯逻辑测试造不出这种素材，只有真实编码器产出的文件才行。
      - name: 构建镜像
        run: docker build -t livemonitor:ci .

      # ffmpeg 仅用于生成测试素材（不同码率、带/不带 Xing 头），
      # 被测镜像自身并不包含 ffmpeg —— 这一点由脚本的第 1 组用例断言。
      - name: 安装 ffmpeg（生成测试素材用）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 运行端到端测试
        env:
          IMAGE: livemonitor:ci
          PREFIX: lmci
        run: |
          set -o pipefail
          bash scripts/e2e.sh 2>&1 | tee "${RUNNER_TEMP}/e2e.log"

      - name: 失败时导出服务日志
        if: failure()
        run: |
          {
            echo "----- 容器列表 -----"
            docker ps -a || true
            # 7.5 节现在用两套独立实例：adopt-svc/target（接管+重启不重放）
            # 与 adopt-web/watch2（外部停止 + 热重载）。
            for c in lmci-svc lmci-target \
                     lmci-adopt-svc lmci-adopt-target \
                     lmci-adopt-web lmci-adopt-watch2; do
              echo "----- $c 日志 -----"
              docker logs "$c" 2>&1 | tail -60 || true
            done
            echo "----- 调度状态文件 -----"
            cat "${RUNNER_TEMP:-/tmp}"/lmci.*/adopt/config/scheduler-state.json 2>/dev/null || true
          } | tee "${RUNNER_TEMP}/e2e-docker.log"

      # 失败时把完整输出上传成 artifact。job 日志在部分受限网络下无法下载
      # （会 302 到 blob 存储域），artifact 走的是另一套接口，通常可达。
      - name: 上传失败诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/e2e-docker.log
          if-no-files-found: warn
          retention-days: 7

      # 把失败断言直接打进 workflow annotation。
      # artifact 与 job 日志在受限网络下都会 302 到 blob 存储域而被代理拦掉，
      # 唯独 annotation 走 check-run 的 output 字段，经 API 可读——
      # 这是唯一能在那种网络下拿到失败原因的通道。
      - name: 输出失败断言摘要
        if: failure()
        run: |
          echo "::group::失败断言"
          grep -n "✘" "${RUNNER_TEMP}/e2e.log" | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "::endgroup::"
          echo "::group::统计"
          tail -5 "${RUNNER_TEMP}/e2e.log"
          echo "::endgroup::"
