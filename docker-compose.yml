services:
  livemonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: livemonitor:1.0.0
    container_name: livemonitor
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LIVEMONITOR_LOG_LEVEL: info
      # Docker Engine API 的 socket 路径。镜像里已设同样的默认值，
      # 这里显式写出是为了让"用哪个 socket"一目了然；改用自定义路径时只需改这两处。
      DOCKER_HOST: "unix:///var/run/docker.sock"
      # Web 管理界面监听地址；设为 off 可完全禁用。
      LIVEMONITOR_WEB_ADDR: ":8080"
      # 如需以指定用户运行（处理挂载目录属主），取消下面两行注释。
      # PUID: "1000"
      # PGID: "1000"
    volumes:
      # 必须挂载 docker socket 才能控制宿主机容器。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 媒体目录：宿主机路径按需修改。
      - ./data/audio:/audio
      # 配置目录：首次启动会自动生成 config.json。
      - ./data/config:/config
    # Web 管理界面端口。
    # 默认只绑定回环地址，避免直接暴露到公网；需要远程访问时改为 "8080:8080"，
    # 但请务必自行加反向代理与访问控制——该界面没有任何鉴权。
    ports:
      - "127.0.0.1:8080:8080"
    # 日志驱动与轮转限制：原脚本的"清理 docker 日志"在宿主机侧更可靠的解法。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
